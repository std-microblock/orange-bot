# dsh-plugin-orange bundle layer: the host bot row and the `orange` agent preset.
# Credentials and endpoints come from env (see /etc/orange/orange.env on the VM).
- insert:
    - id: orange
      name: 'dsh-plugin-orange'
      config:
        dataDir: !!js "process.env.ORANGE_DATA ?? (process.env.HOME + '/.orange')"
        workspace: !!js "process.env.ORANGE_WORKSPACE ?? (process.env.HOME + '/workspace')"
        koishi:
          endpoint: !!js "process.env.ORANGE_KOISHI_ENDPOINT"
          token: !!js "process.env.ORANGE_KOISHI_TOKEN"
        crossgram:
          endpoint: !!js "process.env.ORANGE_CROSSGRAM_ENDPOINT"
          token: !!js "process.env.ORANGE_CROSSGRAM_TOKEN"
        llm:
          baseURL: !!js "process.env.ORANGE_LLM_BASE_URL"
          apiKey: !!js "process.env.ORANGE_LLM_API_KEY"
          model: deepseek/deepseek-v4-flash
          provider: orange-llm
          agentModel: deepseek/deepseek-v4-flash

    - id: preset-orange
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orange
        name: Orange
        description: 橘波特聊天/任务 agent（含聊天工具、完整 shell 与文件权限）
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是橘波特（Orange），运行在一台专用 Linux 虚拟机里。
              suffix: 工具清单与用法见 ~/TOOLS.md。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              instructionFileCandidates: [AGENTS.md, TOOLS.md]
          - id: orange-tools
            name: 'dsh-plugin-orange/tools'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
