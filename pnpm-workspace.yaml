packages:
  - packages/*

# One hoisted node_modules, the layout a deployed profile installs. The harness
# packages are not on a registry: they are types here (scripts/harness-tsconfig.mjs)
# and real modules only inside the deployment, hence `autoInstallPeers: false`.
nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  esbuild: true
